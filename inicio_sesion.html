<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js"></script>
</head>
<body>
    <h1 id="titulo">Inicio de Sesión</h1>
    <div id="Cuadro">
        <div>
            <h2>Inicio de Sesión</h2>
            <label for="username">Nombre de usuario:</label>
            <input type="text" id="username">
            <br>
             <label for="password">Contraseña:</label>
            <input type="password" id="password">
            <br>
            <input type="button" value="Iniciar Sesión" onclick="inicio()">
        </div>
        <div>
           <h2>Registro</h2>
            <label for="newUsername">Ingresa tu nombre de usuario:</label>
            <input type="text" id="newUsername">
            <br>
            <label for="newPassword">Ingresa tu contraseña:</label>
            <input type="password" id="newPassword">
            <br>
            <input type="button" value="Registrarse" onclick="registro()">
        </div>
    </div>
</body>
</html>
